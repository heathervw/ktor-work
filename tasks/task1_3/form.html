<form action = "https://httpbin.io/dump/request" method = "POST">
    <label for ="name">Enter your name:</label>
    <input type="text" id ="name" name ="name">

    <label for ="dob">Enter your DOB:</label>
    <input type="date" id="dob" name="date">

    <label for="em">Enter your email:</label>
    <input type="email" id = "em" name="email">

    <label for ="color"> Enter your favourite colour</label>
    <input type="color" id="color" name="color">

    <input type="radio" id="mos" name="employment" value="MOS">
    <label for="mos">Member of Staff</label>    
    <input type="radio" id="nmos" name="employment" value="!MOS">
    <label for="nmos">NOT a Member of Staff</label>    
    <button>Submit</button>

</form>
